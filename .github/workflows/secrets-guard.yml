name: Secrets guard

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history, so --range can read every commit the PR or push adds.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Scan the tree
        run: node scripts/check-secrets.mjs --all
      - name: Scan every commit in the PR or push
        if: ${{ !cancelled() }}
        # A secret committed and deleted in a later commit is still readable in
        # the public history, so every file version each commit adds is scanned.
        # Sure's upstream history is scanned too: about 4,000 commits took about
        # 5 seconds (measured 2026-11-12), so no commits are skipped.
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then base="$PR_BASE"; else base="$BEFORE"; fi
          # No usable base (a new branch, or a force-push whose old tip is not in
          # the clone): scan every commit reachable from the head instead. A
          # secret added and deleted inside a new branch is public all the same.
          if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ]; then
            echo "No earlier commit to compare with: scanning every commit reachable from $HEAD_SHA."
            base=
          elif ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "::warning::Commit $base is not in the clone (force-push?): scanning every commit reachable from $HEAD_SHA."
            base=
          fi
          # Allowlist entries added here switch rules off; make them visible to the
          # reviewer. With no base there is nothing to diff against, so every
          # entry in the allowlist at the head is listed.
          if [ -n "$base" ]; then
            git diff -U0 "$base" "$HEAD_SHA" -- .secrets-guard-allow \
              | sed -n 's/^+\([^+].*\)$/\1/p'
          else
            git show "$HEAD_SHA:.secrets-guard-allow" 2>/dev/null || true
          fi | tr -d '\r' | sed 's/%/%25/g' \
            | { grep -Ev '^[[:space:]]*(#|$)' || true; } \
            | while IFS= read -r line; do
                echo "::warning file=.secrets-guard-allow,title=Secrets-guard allowlist entry::$line"
              done
          if [ -n "$base" ]; then
            node scripts/check-secrets.mjs --range "$base..$HEAD_SHA"
          else
            node scripts/check-secrets.mjs --range "$HEAD_SHA"
          fi
